# GhostLock kernel profile: 6.1.145-android14-11-maybe-dirty (HOCON).
# Adapted 2026-10-06 from the device's v1.0 BTE extraction report; every
# offset cross-checked against the boot image inside vivo OTA
# 20260724140640d2482f3405b8045dd5ceb66beb026d89.zip (kallsyms rebuilt,
# symbol-exact). The vr pair is verified: struct tracepoint funcs sits at
# +0x40 on this kernel (tracepoint_add_func's stlr publish), and the trace
# layout carries the static_call rework (SCK ptr +0x18, iter +0x28).
# Fixed vs the community conf: restores the select_stack fallback
# (waiter_shift = 1) the slide stage needs; without it the pselect-based
# KASLR delta lands wrong and W1 faults.
include "credential-6x.conf"
include "kernelsnitch-6x.conf"
release = "6.1.145-android14-11-maybe-dirty"
schema_version = 1
kernel_major = 6
recommend_shizuku = 0
recommend_vr_guard = 1
kernel_phys_load = 2818572288
kernel_phys_offset = null
route {
  tcp_zerocopy {
    compact_waiter = 1
  }
}
fallback {
  to = "select_stack"
  route {
    select_stack {
      waiter_shift = 1
    }
  }
}
kernelsnitch {
  mm_struct_sz = 1024
}
vr_guard {
  tracepoint_funcs = 64
}
